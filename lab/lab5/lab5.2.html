<html>

<head>
    <script>
        function checkPassword() {
            var pass = document.getElementById("pass1");
            var repass = document.getElementById("pass2");

            if (!pass.value | !repass.value) {
                return;
            }

            if (pass.value == repass.value) {
                var err = document.getElementById("errormsg");
                err.innerHTML = "Correct"
                err.style.color = "Green"
            } else {
                var err = document.getElementById("errormsg");
                err.innerHTML = "Incorrect"
                err.style.color = "Red"
            }
        }
    </script>
</head>

<body>
    <h1>Register</h1>
    Username: <input type="text"><br>
    Password: <input type="text" id="pass1"><br>
    Re-type Password: <input type="text" id="pass2"><br>
    <input type="submit" onclick="checkPassword()">
    <div id="errormsg"></div>
</body>

</html>
