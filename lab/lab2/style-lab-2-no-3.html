<!DOCTYPE html>
<html lang="en">
<style>
    table,
        th,
        td {
            border: 1px solid black;
            text-align: center;
            font-weight: normal;
            background-color: #F8F8F8;
            text-align: left;
            cursor: pointer;
        }

        th:hover {
            background-color: aqua;
        }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>A</th>
            <th>B</th>
        </tr>
        <tr>
            <th colspan="2">C</th>
        </tr>
    </table>
</body>
</html>
