<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            text-align: left;
            font-weight: normal;
            background-color: #F8F8F8;
            cursor: pointer;
        }

        tr:hover th {
            background-color: aqua;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>A</th>
            <th>B</th>
        </tr>
        <tr>
            <th colspan="2">C</th>
        </tr>
    </table>
</body>
</html>
