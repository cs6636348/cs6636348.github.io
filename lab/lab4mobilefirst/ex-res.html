<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
    }

    main {
      display: flex;
      flex-direction: column;
    }

    nav {
      background-color: black;
      color: white;
      text-align: center;
      padding: 10px;
    }

    section {
      background-color: gainsboro;
      padding: 10px;
    }

    aside {
      background-color: cornflowerblue;
      padding: 10px;
    }

    @media (min-width: 601px) {
      main {
        flex-direction: row;
      }

      nav {
        flex-grow: 10;
      }

      section {
        flex-grow: 20;
      }

      aside {
        flex-grow: 5;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav>Menu1<br>Menu2<br>Menu3<br></nav>
    <section>In publishing, art, and communication, … as speech, writing or any of various arts.</section>
    <aside>advertising<br>advertising<br>advertising<br></aside>
  </main>
</body>
</html>
